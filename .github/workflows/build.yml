name: Build Technical Tape (Mac AU + VST3, Windows VST3)

on:
  push:
    branches: ['**']
    paths-ignore: ['README.md', 'docs/**', 'Tools/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64, macOS 11+)
        run: |
          set -o pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DTT_BUILD_TOOLS=OFF 2>&1 | tee configure.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Release --target TechnicalTape_AU TechnicalTape_VST3 -j 4 2>&1 | tee build.log

      - name: Sign (ad hoc) and package
        run: |
          set -e
          ART="build/TechnicalTape_artefacts/Release"
          AU="$ART/AU/Technical Tape.component"
          VST3="$ART/VST3/Technical Tape.vst3"
          codesign --force --deep --sign - "$AU"
          codesign --force --deep --sign - "$VST3"
          lipo -info "$AU/Contents/MacOS/Technical Tape" | tee lipo.log
          mkdir -p "dist/Technical Tape"
          cp -R "$AU" "$VST3" "dist/Technical Tape/"
          cp README.md "dist/Technical Tape/READ ME.md"
          cd dist && ditto -c -k --sequesterRsrc --keepParent "Technical Tape" TechnicalTape-mac.zip

      - name: Validate the AU (auval)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/TechnicalTape_artefacts/Release/AU/Technical Tape.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -v aufx TtSp SqAu 2>&1 | tee auval.log | tail -40

      # Drives the editor the way a user would (type-in values, saving and loading presets) on a real Mac.
      # Built separately (native arch only), after packaging, so the shipped plug-ins are untouched.
      - name: Editor checks (snapshot)
        continue-on-error: true
        run: |
          set -o pipefail
          cmake -B build-snap -DCMAKE_BUILD_TYPE=Release -DTT_BUILD_TOOLS=ON -DCMAKE_OSX_ARCHITECTURES=arm64 \
                -DTT_JUCE_PATH="$PWD/build/_deps/juce-src" > snapshot-configure.log 2>&1
          cmake --build build-snap --target TTSnapshot -j 4 2>&1 | tee snapshot-build.log | tail -5
          "build-snap/TTSnapshot_artefacts/Release/TTSnapshot" "$PWD/snap" 2>&1 | tee mac-snapshot.log

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp dist/TechnicalTape-mac.zip lipo.log out/ 2>/dev/null || true
          cp auval.log mac-snapshot.log out/ 2>/dev/null || true
          for f in snap/*.png; do [ -f "$f" ] && cp "$f" "out/mac-$(basename "$f")"; done; true

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: out/

      - name: Publish logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/logs && cp *.log /tmp/logs/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > /tmp/logs/COMMIT
          cd /tmp/logs
          git init -q && git checkout -q -b build-logs-mac
          git add -A
          git -c user.name="build bot" -c user.email="build-bot@users.noreply.github.com" commit -q -m "mac build logs for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build-logs-mac

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Configure (64-bit)
        run: |
          set -o pipefail
          cmake -B build -A x64 -DTT_BUILD_TOOLS=OFF 2>&1 | tee configure.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Release --target TechnicalTape_VST3 --parallel 4 2>&1 | tee build.log

      - name: Package
        shell: pwsh
        run: |
          $vst3 = "build/TechnicalTape_artefacts/Release/VST3/Technical Tape.vst3"
          New-Item -ItemType Directory -Force -Path "dist/Technical Tape" | Out-Null
          Copy-Item -Recurse $vst3 "dist/Technical Tape/"
          Copy-Item README.md "dist/Technical Tape/READ ME.md"
          Compress-Archive -Path "dist/Technical Tape" -DestinationPath "dist/TechnicalTape-win64.zip"
          Get-ChildItem -Recurse "dist/Technical Tape" | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300 | Tee-Object -FilePath contents.log

      - name: Validate (pluginval)
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $pv = (Get-ChildItem -Recurse pluginval -Filter pluginval.exe | Select-Object -First 1).FullName
          & $pv --strictness-level 5 --timeout-ms 900000 --validate "build/TechnicalTape_artefacts/Release/VST3/Technical Tape.vst3" *>&1 | Tee-Object -FilePath pluginval.log
          exit $LASTEXITCODE

      # Renders the editor with Windows' own graphics stack, to check fonts and layout.
      # Built after packaging, so the shipped VST3 is untouched.
      - name: Render the editor (snapshot)
        continue-on-error: true
        run: |
          set -o pipefail
          cmake -B build -DTT_BUILD_TOOLS=ON > snapshot-configure.log 2>&1
          cmake --build build --config Release --target TTSnapshot --parallel 4 2>&1 | tee snapshot-build.log | tail -5
          exe=$(find build -name TTSnapshot.exe | head -1)
          "$exe" "$(cygpath -w "$PWD/snap")" 2>&1 | tee win-snapshot.log

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp dist/TechnicalTape-win64.zip out/ 2>/dev/null || true
          cp contents.log pluginval.log win-snapshot.log out/ 2>/dev/null || true
          for f in snap/*.png; do [ -f "$f" ] && cp "$f" "out/win-$(basename "$f")"; done; true

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/

      - name: Publish logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/logs && cp *.log /tmp/logs/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > /tmp/logs/COMMIT
          cd /tmp/logs
          git init -q && git checkout -q -b build-logs-win
          git add -A
          git -c user.name="build bot" -c user.email="build-bot@users.noreply.github.com" commit -q -m "windows build logs for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build-logs-win

  publish:
    needs: [mac, windows]
    # publish whatever built: a busy macOS runner pool should not hold back the Windows build
    if: ${{ always() && (needs.mac.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CMakeLists.txt
          sparse-checkout-cone-mode: false

      - name: Release tag from the project version
        id: ver
        run: |
          VERSION=$(sed -n 's/^project(TechnicalTape VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=build-${VERSION}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: art

      - name: Publish the builds to the 'builds' branch
        run: |
          set -e
          mkdir -p /tmp/out
          for d in art/*/; do cp "$d"* /tmp/out/; done
          ls -la /tmp/out
          echo "${GITHUB_SHA}" > /tmp/out/COMMIT
          cd /tmp/out
          git init -q && git checkout -q -b builds
          git add -A
          git -c user.name="build bot" -c user.email="build-bot@users.noreply.github.com" commit -q -m "builds of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds

      - name: Release
        # a commit message containing [no release] still builds and updates 'builds', but makes no release
        if: ${{ !contains(github.event.head_commit.message, '[no release]') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Technical Tape ${{ steps.ver.outputs.version }} (Mac + Windows, ${{ steps.ver.outputs.tag }})
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: false
          files: |
            art/mac/TechnicalTape-mac.zip
            art/windows/TechnicalTape-win64.zip
          body: |
            Mac: AU + VST3, universal (Apple Silicon and Intel), macOS 11 or later. Ad-hoc signed for personal use.
            Windows: VST3, 64-bit, Windows 10 or later.
            Install steps are in READ ME.md inside each zip.
